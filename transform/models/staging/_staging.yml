version: 2

models:
  - name: stg_digitraffic__trains
    description: One row per train run (departure date + train number).
    columns:
      - name: train_run_id
        data_tests: [unique, not_null]
      - name: train_category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Commuter, Long-distance, Cargo, Locomotive, Shunting,
                         On-track machines, Test drive]
              config:
                severity: warn  # a new category should be noticed, not block the run
      - name: is_cancelled
        data_tests: [not_null]

  - name: stg_digitraffic__timetable_rows
    description: >
      One row per scheduled arrival or departure, including stations passed without
      stopping. Times are naive UTC timestamps.
    columns:
      - name: timetable_row_id
        data_tests: [unique, not_null]
      - name: train_run_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_digitraffic__trains')
                field: train_run_id
      - name: station_code
        data_tests: [not_null]
      - name: stop_type
        data_tests:
          - accepted_values:
              arguments:
                values: [ARRIVAL, DEPARTURE]
      - name: scheduled_at_utc
        data_tests: [not_null]

  - name: stg_digitraffic__delay_causes
    columns:
      - name: delay_cause_id
        data_tests: [unique, not_null]
      - name: category_code
        data_tests: [not_null]

  - name: stg_digitraffic__stations
    columns:
      - name: station_code
        data_tests: [unique, not_null]

  - name: stg_digitraffic__cause_categories
    columns:
      - name: category_code
        data_tests: [unique, not_null]
